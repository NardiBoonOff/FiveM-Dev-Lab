{% extends 'base.html' %}

{% block title %}Settings - FiveM Dev Lab{% endblock %}

{% block content %}
<div class="page-header">
  <h2>⚙️ Settings</h2>
  <p class="text-muted mb-0">Panel configuration and preferences</p>
</div>

<div class="card p-4">
  <form method="post">
    <h5 class="mb-4">🎨 Panel Configuration</h5>
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <label class="form-label">App Name</label>
        <input class="form-control" name="app_name" value="{{ config.app_name }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Theme</label>
        <select class="form-select" name="theme">
          <option value="dark" {% if config.theme == 'dark' %}selected{% endif %}>🌙 Dark</option>
          <option value="light" {% if config.theme == 'light' %}selected{% endif %}>☀️ Light</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Primary Color</label>
        <input class="form-control" type="color" name="primary_color" value="{{ config.primary_color }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Default Environment</label>
        <select class="form-select" name="default_environment">
          <option value="dev" {% if config.default_environment == 'dev' %}selected{% endif %}>🔧 Development</option>
          <option value="staging" {% if config.default_environment == 'staging' %}selected{% endif %}>🎯 Staging</option>
          <option value="prod" {% if config.default_environment == 'prod' %}selected{% endif %}>🚀 Production</option>
          <option value="test" {% if config.default_environment == 'test' %}selected{% endif %}>🧪 Test</option>
        </select>
      </div>
    </div>

    <hr class="my-4">
    <h5 class="mb-4">🤖 Discord Integration</h5>
    <div class="row g-3 mb-4">
      <div class="col-12">
        <label class="form-label">Webhook URL</label>
        <input class="form-control" type="url" name="webhook_url" value="{{ config.webhook_url }}" placeholder="https://discordapp.com/api/webhooks/...">
        <small class="text-muted">Optional: Receive notifications on Discord for important events</small>
      </div>
    </div>

    <hr class="my-4">
    <h5 class="mb-4">🔐 Authentication</h5>
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <label class="form-label">Admin Username</label>
        <input class="form-control" name="default_admin_user" value="{{ config.default_admin_user }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Admin Password</label>
        <input class="form-control" type="password" name="default_admin_password" placeholder="Leave blank to keep current password">
      </div>
    </div>

    <div class="d-flex justify-content-end gap-2">
      <button class="btn btn-secondary" type="button" onclick="history.back()">← Cancel</button>
      <button class="btn btn-primary" type="submit">💾 Save Settings</button>
    </div>
  </form>
</div>
{% endblock %}
