{% extends 'base.html' %}

{% block title %}Login - FiveM Dev Lab{% endblock %}

{% block content %}
<div class="login-shell">
  <div class="card login-card">
    <h2 class="text-center mb-4">FiveM Dev Lab</h2>
    <p class="text-center text-muted mb-4">Professional Server Manager</p>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input class="form-control" name="username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Login</button>
    </form>
    <hr class="my-3">
    <p class="text-center text-muted small">Default: admin / admin123</p>
  </div>
</div>
{% endblock %}
