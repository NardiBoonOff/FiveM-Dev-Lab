{% extends 'base.html' %}
{% block content %}
<div class="page-header d-flex justify-content-between align-items-center">
  <div>
    <h2>Backups</h2>
    <p class="text-muted mb-0">Snapshots and local backups</p>
  </div>
  <form method="post" action="{{ url_for('create_backup') }}">
    <button class="btn btn-primary" type="submit">Create backup</button>
  </form>
</div>

<div class="card p-3">
  <div class="table-responsive">
    <table class="table table-dark table-borderless mb-0">
      <thead>
        <tr>
          <th>Name</th>
          <th>Size</th>
          <th>Type</th>
        </tr>
      </thead>
      <tbody>
        {% for backup in backups %}
          <tr>
            <td>{{ backup.name }}</td>
            <td>{{ backup.size }} bytes</td>
            <td>{{ backup.type }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
